name: upper-image

on:
  push:
    paths:
      - ".github/workflows/upper-image.yml"
      - "upper/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker version
        run: docker version

      # GHCR image names should be lowercase.
      # BlackRabbitHere -> blackrabbithere
      - name: Set image name
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/upper" >> "$GITHUB_ENV"

      - name: Show image name
        run: echo "Image will be pushed to $IMAGE_NAME"

      - name: Build Docker image
        working-directory: ./upper
        run: docker build -t upper .

      - name: Test Docker image
        run: docker run --rm upper hello wes

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag latest image
        run: docker tag upper $IMAGE_NAME:latest

      - name: Tag image with commit SHA
        run: docker tag upper $IMAGE_NAME:${{ github.sha }}

      - name: Push latest image
        run: docker push $IMAGE_NAME:latest

      - name: Push SHA image
        run: docker push $IMAGE_NAME:${{ github.sha }}
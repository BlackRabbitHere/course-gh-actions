name: upper-capture

on:
  push:
    paths:
      - ".github/workflows/upper-capture.yml"
      - "upper/**"

  workflow_dispatch:

jobs:
  capture:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: upper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: ./upper/go.sum

      - name: Show Go version
        run: go version

      - name: List files
        run: ls

      - name: Build
        run: go build

      - name: Run tests
        run: go test -v

      - name: List build output
        run: ls

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          path: ./upper/upper*
          name: build-${{ matrix.os }}